[package]
name = "wp-comment2shell-check"
version = "0.1.0"
edition = "2021"
description = "Passive WordPress version checker for CVE-2026-93485 (Comment2Shell)"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
futures = "0.3"
regex = "1"
once_cell = "1"

[profile.release]
opt-level = 3
